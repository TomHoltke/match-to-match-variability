[project]
name = "match-variability"
version = "1.0.0"
description = "Match-to-match variability of physical-demand metrics in professional football: code and data to reproduce the manuscript"
authors = [{ name = "Tom Höltke" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<2.4.0)",   # numpy 2.4+ breaks DataBallPy 0.7.2 (pandera) in step 1
    "scipy (>=1.18.1,<2.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
]

[project.optional-dependencies]
# Only for scripts/1_tracking_pipeline (needs the raw tracking data, not shared).
tracking = [
    "databallpy (==0.7.2)",
    "pyarrow (>=19.0.1,<20.0.0)",
]

[tool.poetry]
packages = [{ include = "match_variability", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.0.0,<10.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
